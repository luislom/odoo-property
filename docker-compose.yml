services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons      # tus módulos (versionados en git)
      - ./config:/etc/odoo              # odoo.conf
      - odoo-data:/var/lib/odoo         # filestore y sesiones (NO en git)
    restart: unless-stopped

volumes:
  db-data:
  odoo-data: